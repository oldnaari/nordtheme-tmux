#+----------------+
#+ Plugin Support +
#+----------------+
#+--- tmux-prefix-highlight ---+
set -g @prefix_highlight_output_prefix "#[fg=brightcyan]#[bg=black]#[nobold]#[noitalics]#[nounderscore]#[bg=brightcyan]#[fg=black]"
set -g @prefix_highlight_output_suffix ""
set -g @prefix_highlight_copy_mode_attr "fg=brightcyan,bg=black,bold"

#+--------+
#+ Status +
#+--------+
#+--- Bars ---+
set -g status-left "#[fg=blue,bg=brightblack,bold] #S #[fg=brightblack,bg=black,nobold,noitalics,nounderscore] "
set -g status-right "#{prefix_highlight}#[fg=brightblack,bg=black,nobold,noitalics,nounderscore]#[fg=blue,bg=brightblack] ${NORD_TMUX_STATUS_DATE_FORMAT} #[fg=blue,bg=brightblack,nobold,noitalics,nounderscore]#[fg=blue,bg=brightblack] ${NORD_TMUX_STATUS_TIME_FORMAT} "

#+--- Windows ---+
set -g window-status-format "#[fg=black]#{?#{==:#{@tab-color},yellow},#[bg=yellow],#{?#{==:#{@tab-color},magenta},#[bg=magenta],#{?#{==:#{@tab-color},blue},#[bg=blue],#{?#{==:#{@tab-color},red},#[bg=red],#{?#{==:#{@tab-color},green},#[bg=green],#[bg=cyan]}}}}}#[nobold,noitalics,nounderscore]#{?#{==:#{@tab-color},yellow},#[fg=yellow],#{?#{==:#{@tab-color},magenta},#[fg=magenta],#{?#{==:#{@tab-color},blue},#[fg=blue],#{?#{==:#{@tab-color},red},#[fg=red],#{?#{==:#{@tab-color},green},#[fg=green],#[fg=cyan]}}}}}#[bg=brightblack] #[fg=white,bg=brightblack]#W #[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-current-format "#[fg=black,bg=white,nobold,noitalics,nounderscore]#[fg=white,bg=brightblack] #[fg=white,bg=brightblack]#W #[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-separator " "
